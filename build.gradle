plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

repositories {
    mavenCentral()  // jcenter() is deprecated
}

dependencies {
    testImplementation 'junit:junit:4.12'
}

group = 'io.github.coordinates2country'
version = '1.10'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'coordinates2country'
            from components.java
            pom {
                name = 'Coordinates2Country'
                description = 'Fast offline reverse geocoding'
                url = 'https://github.com/coordinates2country/coordinates2country'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'Nicolas_Raoul'
                        name = 'Nicolas Raoul'
                        email = 'nicolas.raoul@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/coordinates2country/coordinates2country.git'
                    developerConnection = 'scm:git:ssh://github.com/coordinates2country/coordinates2country.git'
                    url = 'https://github.com/coordinates2country/coordinates2country'
                }
            }
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri('https://central.sonatype.com/api/v1/publisher/'))
            snapshotRepositoryUrl.set(uri('https://central.sonatype.com/api/v1/publisher/'))
            username = findProperty('centralUsername')
            password = findProperty('centralPassword')
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}
